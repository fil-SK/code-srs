<!doctype html>
<!-- The app is light-only (no dark palette exists), so the theme is declared
     statically here. There is no pre-paint theme script: it existed to restore
     a saved dark/light choice, and with no toggle there is nothing to restore. -->
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/itera-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Itera</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
