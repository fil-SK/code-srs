<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/fliptap-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f7f9" />
    <script>
      // Restore before styles paint, including on standalone and login routes.
      try {
        const preference = localStorage.getItem('code-srs-theme')
        const dark = preference === 'dark' ||
          (preference === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        document.querySelector('meta[name="theme-color"]').content = dark ? '#0f1724' : '#f6f7f9'
      } catch {
        // Keep the default light theme when preference storage is unavailable.
      }
    </script>
    <title>FlipTap</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
